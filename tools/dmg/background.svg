<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- The background of the release disk image's window (ADR 0034): the icon's
       warm plate, and an amber arrow from the app (left) to Applications (right).
       tools/dmg/settings.py places the icons at x 150 and 450, y 190. No text,
       so nothing to translate. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEAE2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#plate)"/>
  <g fill="none" stroke="#D9921A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M246 190 C280 170 320 170 352 186"/>
    <path d="M334 166 L356 188 L328 202"/>
  </g>
</svg>
