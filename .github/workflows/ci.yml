# Builds and tests Treewise after each push to main, once a week and when started
# by hand (ADR 0075). The weekly run finds what changes without a commit, such as
# the runner's image. Before a push the gate is local: tools/build.sh verify and
# the git hooks. A release needs tools/build.sh ci on the owner's Mac.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CHANGELOG.md
  schedule:
    # Sunday evening; GitHub's schedule is in UTC and may start late.
    - cron: "0 20 * * 0"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # The build number is the build's local date and time (ADR 0013); the runner
      # runs in UTC, so give it the owner's time zone to match local builds.
      TZ: Europe/Amsterdam
    steps:
      - uses: actions/checkout@v5

      - name: Select the pinned Xcode
        run: |
          source tools/versions.env
          app="/Applications/Xcode_${CI_XCODE_VERSION}.app"
          if [[ ! -d "$app" ]]; then
            echo "Xcode ${CI_XCODE_VERSION} is not on this runner. Available:" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$app"

      - name: Set up the environment
        run: tools/setup.sh --no-simulator

      # The same as tools/build.sh ci, in separate steps: each shows its own time.
      - name: Sample package tests that hang
        # Healthy package tests take seconds, so any still running after six minutes
        # hang. The samples show where each thread waits; the patterns are bracketed
        # so that they do not match this shell's own command line.
        run: |
          nohup bash -c '
            sleep 360
            mkdir -p build/logs
            for pid in $(pgrep -f "[s]wiftpm-testing-helper|[T]reewiseKitPackageTests"); do
              sample "$pid" 5 -file "build/logs/hang-$pid.txt"
            done
          ' >/dev/null 2>&1 &

      - name: Check and package tests
        timeout-minutes: 10
        run: tools/build.sh quick

      - name: Build both apps
        run: tools/build.sh build

      - name: UI tests
        run: tools/build.sh apptest

      - name: Keep logs and test results
        # Also after a timeout, which counts as cancelled and not as a failure.
        if: ${{ !success() }}
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: |
            build/logs
            build/reports
          retention-days: 7
